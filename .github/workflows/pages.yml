name: Pages

# Builds the site and refreshes the PROFECO data on a schedule. The data is deploy-time only
# (public/data/qqp/ is gitignored): a failed fetch fails the job before deploying, so the
# previous deployment keeps serving. See docs/PIPELINES.md.
on:
  push:
    branches: [main]
  schedule:
    # Tuesdays 13:00 UTC (07:00 Mexico City): PROFECO's weekly files have usually landed by then.
    - cron: '0 13 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Keep only the RAR archives between runs (the previous year's 85 MB never changes; the
      # current year's is re-downloaded when PROFECO republishes it). The extracted CSVs are
      # several GB and are rebuilt from the archives, so they stay out of the cache.
      - uses: actions/cache@v4
        with:
          path: data/cache/qqp/raw
          key: qqp-raw-${{ github.run_id }}
          restore-keys: qqp-raw-
      # bsdtar (libarchive) reads RAR5; Debian's 7zip packages may ship without the RAR codec.
      # The pipeline proves each extractor on the archive before using it.
      - run: sudo apt-get install -y --no-install-recommends libarchive-tools
      # No continue-on-error: if the download or the build of the data fails, or the output breaks
      # the contract (tools/check-qqp.mjs), the job fails and the previous deployment stays live.
      # Publishing the app without its data would be worse than publishing last week's data.
      - run: npm run qqp
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # the opening's data (Relieve), computed from the pipeline's outputs
      - run: npm run opening
      - run: npm run check
      # The base path is the repository's name, so a rename needs no edit here (compa-precio until
      # 2026-10-22, then a-como). GITHUB_REPOSITORY ("owner/name") is set on every trigger, while
      # github.event.repository is absent from a scheduled run's payload. The grep fails the job
      # when the built page does not load its assets from that base.
      - run: |
          export VITE_BASE="/${GITHUB_REPOSITORY#*/}/"
          echo "base path: $VITE_BASE"
          npm run build
          grep -q "src=\"${VITE_BASE}assets/" dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
