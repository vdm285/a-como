name: Pages

# Builds the site and refreshes the PROFECO data on a schedule. The data is deploy-time only
# (public/data/qqp/ is gitignored): a failed fetch never fails the deploy, the previous deploy
# simply keeps serving. See docs/PIPELINES.md.
on:
  push:
    branches: [main]
  schedule:
    # Tuesdays 13:00 UTC (07:00 Mexico City): PROFECO's weekly files have usually landed by then.
    - cron: '0 13 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Keep only the RAR archives between runs (the previous year's 85 MB never changes; the
      # current year's is re-downloaded when PROFECO republishes it). The extracted CSVs are
      # several GB and are rebuilt from the archives, so they stay out of the cache.
      - uses: actions/cache@v4
        with:
          path: data/cache/qqp/raw
          key: qqp-raw-${{ github.run_id }}
          restore-keys: qqp-raw-
      - run: npm run qqp
        continue-on-error: true
      - run: npm run build
        env:
          VITE_BASE: /compa-precio/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
