<meta charset="utf-8">

<title>A cómo · Relieve</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
:root {
  color-scheme: dark;
  --bg: #0c1118;
  --ink: #f4f5f7;
  --ink-2: #b9bec7;
  --ink-3: #8a919c;
  --cheaper: #3987e5;
  --dearer: #e66767;
  --mid: #5b616a;
  --accent: #ece6d8;
  --accent-ink: #14171c;
  --line: rgba(255, 255, 255, 0.08);
  --line-2: rgba(255, 255, 255, 0.16);
  --glass: rgba(14, 19, 28, 0.80);
  --glass-2: rgba(22, 29, 40, 0.95);
  --scrim: rgba(12, 17, 24, 0.94);
  --scrim-mid: rgba(12, 17, 24, 0.62);
  --scrim-0: rgba(12, 17, 24, 0);
  --map-alc: rgba(255, 255, 255, 0.17);
  --map-zm: rgba(255, 255, 255, 0.075);
  --map-road: rgba(255, 255, 255, 0.07);
  --dot: #8a919c;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --font: 'Manrope', system-ui, sans-serif;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --gut: 16px;
  --low: 150px;
}
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); }
html, body { margin: 0; overflow: hidden; }
body { color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.drag { cursor: grabbing; }
#stage.over { cursor: pointer; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.scrim { position: fixed; pointer-events: none; z-index: 1; }
.scrim.l { left: 0; top: 0; bottom: 0; width: 640px; background: linear-gradient(90deg, var(--scrim) 0%, var(--scrim-mid) 52%, var(--scrim-0) 100%); }
.scrim.b { left: 0; right: 0; bottom: 0; height: 190px; background: linear-gradient(0deg, var(--scrim) 0%, var(--scrim-0) 100%); }
.scrim.t { display: none; }

/* ---------- hero (top left) ---------- */
.hero { position: fixed; z-index: 3; top: 34px; left: 40px; width: 420px; pointer-events: none; }
.head { display: flex; flex-direction: column; gap: 18px; }
.brand { font-weight: 800; font-size: 15px; letter-spacing: 0.01em; color: var(--accent); }
.brand::after { content: ''; display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: var(--accent); opacity: 0.5; vertical-align: 2px; }
h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 800; letter-spacing: -0.015em; }
.pres { margin-top: 5px; font-size: 12.5px; color: var(--ink-3); max-width: 360px; }
.bignum { margin-top: 26px; opacity: 0; transition: opacity 600ms var(--ease); }
.bignum.on { opacity: 1; }
.big { display: block; font-size: 92px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.92; }
.bigcap { display: block; margin-top: 10px; color: var(--ink-2); font-size: 14px; }
.wk { margin-top: 3px; font-size: 14px; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 22px; opacity: 0; transition: opacity 600ms var(--ease); }
.wk.on { opacity: 1; }
.wk .n { color: var(--ink-2); font-weight: 600; }
.chip { font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); }
.chip.hot { border-color: rgba(230, 103, 103, 0.55); color: var(--ink); }

.story { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line-2); opacity: 0; transform: translateY(10px); transition: opacity 900ms var(--ease), transform 900ms var(--ease); }
.story.on { opacity: 1; transform: none; }
.st-kick { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); font-weight: 800; }
.st-row { display: flex; align-items: baseline; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
.st-num { font-size: 54px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; }
.st-num.cheap { color: var(--cheaper); }
.st-lab { color: var(--ink-2); font-size: 14px; font-weight: 600; }
.st-p { margin: 10px 0 0; color: var(--ink-2); font-size: 14px; line-height: 1.5; max-width: 380px; }
.st-p b { color: var(--ink); font-weight: 800; }
.st-two { display: flex; gap: 28px; margin-top: 8px; }
.st-two .v { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.st-two .l { color: var(--ink-2); font-size: 13px; margin-top: 6px; display: flex; align-items: center; gap: 7px; }
.st-two .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* ---------- caption (the opening's one line) ---------- */
.caption { position: fixed; z-index: 3; left: 50%; bottom: calc(var(--low) + 8px); transform: translate(-50%, 6px); width: min(640px, calc(100vw - 2 * var(--gut))); text-align: center; color: var(--ink); font-size: 17px; font-weight: 600; line-height: 1.45; opacity: 0; transition: opacity 700ms var(--ease), transform 700ms var(--ease); pointer-events: none; text-wrap: balance; text-shadow: 0 1px 12px rgba(12, 17, 24, 0.9); }
.caption.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- labels in the scene ---------- */
.reflab { position: fixed; z-index: 2; left: 0; top: 0; pointer-events: none; display: flex; align-items: center; gap: 8px; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 800; color: var(--ink-2); white-space: nowrap; opacity: 0; transition: opacity 500ms; will-change: transform; text-shadow: 0 1px 8px rgba(12, 17, 24, 0.95); }
.reflab i { width: 22px; height: 1px; background: var(--accent); opacity: 0.8; margin-right: -8px; }
.reflab .rl { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line-2); }
.reflab b { color: var(--ink); font-weight: 800; letter-spacing: 0; text-transform: none; font-size: 13px; }

/* ---------- top right ---------- */
.topbar { position: fixed; z-index: 4; top: 22px; right: 24px; display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 15px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: var(--ink-2); font-size: 13.5px; font-weight: 600; transition: color 150ms, border-color 150ms; }
.pill:hover { color: var(--ink); border-color: var(--line-2); }
.pill svg { width: 16px; height: 16px; flex: none; }
.hint { position: fixed; z-index: 3; bottom: 26px; right: 28px; font-size: 12px; color: var(--ink-3); pointer-events: none; opacity: 0; transition: opacity 600ms; text-align: right; }
.hint.on { opacity: 1; }

/* ---------- legend + credit (bottom left) ---------- */
.side { position: fixed; z-index: 4; left: 24px; bottom: 18px; width: 316px; display: flex; flex-direction: column; gap: 10px; }
.legend { padding: 12px 14px 12px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 12px; color: var(--ink-2); }
.legend .lt { color: var(--ink); font-weight: 700; font-size: 12.5px; margin-bottom: 8px; }
.legend .bar { height: 8px; border-radius: 4px; }
.legend .ticks { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin-top: 5px; font-variant-numeric: tabular-nums; }
.legend .ticks span:nth-child(2) { text-align: center; color: var(--ink); font-weight: 700; }
.legend .ticks span:nth-child(3) { text-align: right; }
.legend .ticks small { display: block; color: var(--ink-3); font-size: 11px; }
.legend .li { display: flex; gap: 9px; align-items: flex-start; margin-top: 9px; line-height: 1.35; }
.legend .li svg { flex: none; width: 22px; height: 14px; margin-top: 1px; }
.legend .li.ring { max-height: 48px; overflow: hidden; transition: max-height 500ms var(--ease), opacity 500ms var(--ease), margin-top 500ms var(--ease); }
.legend .li.ring.off { max-height: 0; opacity: 0; margin-top: 0; }
.legend-m .lmr { transition: opacity 500ms var(--ease); }
.legend-m .lmr.off { opacity: 0; }
.credit { font-size: 11px; line-height: 1.5; color: var(--ink-3); padding: 0 2px; }

/* ---------- dock (timeline) ---------- */
.dock { position: fixed; z-index: 4; bottom: 18px; left: max(364px, calc(50vw - 340px)); width: min(680px, calc(100vw - 364px - 24px)); padding: 10px 14px 6px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); }
.dock .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.play { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.play:hover { filter: brightness(1.06); }
.play svg { width: 15px; height: 15px; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); flex: none; }
.seg button { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-3); white-space: nowrap; transition: color 150ms, background 150ms; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed='true'] { background: rgba(255, 255, 255, 0.1); color: var(--ink); }
.wkctl { margin-left: auto; display: flex; align-items: center; gap: 2px; min-width: 0; }
.wkd .ws { display: none; }
.wkd { font-size: 13px; font-weight: 700; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.step { width: 28px; height: 28px; border-radius: 50%; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.step:hover { background: var(--line); color: var(--ink); }
.step svg { width: 14px; height: 14px; }
.scrub { position: relative; height: 58px; margin-top: 6px; }
.scrub svg { position: absolute; left: 0; top: 0; width: 100%; height: 42px; overflow: visible; pointer-events: none; }
.scrub input { position: absolute; left: 0; top: 0; width: 100%; height: 42px; margin: 0; padding: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.scrub input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.scrub input::-webkit-slider-runnable-track { height: 42px; background: transparent; border: 0; }
.scrub input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 42px; background: transparent; border: 0; }
.scrub input::-moz-range-track { height: 42px; background: transparent; border: 0; }
.scrub input::-moz-range-thumb { width: 16px; height: 42px; background: transparent; border: 0; }
.months { position: absolute; left: 0; right: 0; top: 43px; height: 14px; font-size: 10.5px; color: var(--ink-3); pointer-events: none; }
.months span { position: absolute; transform: translateX(-2px); white-space: nowrap; }
.sp-all { fill: none; stroke: var(--ink-3); stroke-opacity: 0.45; stroke-width: 1.5; stroke-linejoin: round; }
.sp-done { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
.sp-ref { stroke: var(--accent); stroke-opacity: 0.6; stroke-dasharray: 3 3; stroke-width: 1; }
.sp-pt { fill: var(--ink-3); }
.sp-pt.part { fill: var(--bg); stroke: var(--ink-3); stroke-width: 1; }
.sp-cur line { stroke: var(--accent); stroke-width: 1; stroke-opacity: 0.55; }
.sp-cur circle { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
.sp-reflab { fill: var(--ink-3); font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em; }
.legend-m { display: none; }

/* ---------- tooltip ---------- */
.tip { position: fixed; z-index: 6; left: 0; top: 0; pointer-events: none; background: var(--glass-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font-size: 13px; box-shadow: var(--shadow); width: max-content; max-width: min(300px, calc(100vw - 2 * var(--gut))); will-change: transform; }
.tip .n { font-weight: 800; line-height: 1.25; }
.tip .m { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.tip .pr { margin-top: 7px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tip .pr b { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tip .dv { font-size: 12px; font-weight: 700; }
.tip .lat { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 12px; }

.nogl { position: fixed; z-index: 5; top: 22px; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 2 * var(--gut)); padding: 9px 14px; border-radius: 12px; background: var(--glass-2); border: 1px solid var(--line-2); font-size: 13px; color: var(--ink-2); text-align: center; }

/* short desktop windows: the legend keeps only its scale, the hero tightens */
@media (min-width: 760px) and (max-height: 820px) {
  .legend .li { display: none; }
  .hero { top: 26px; }
  .head { gap: 12px; }
  .bignum { margin-top: 16px; }
  .big { font-size: 70px; }
  .story { margin-top: 18px; padding-top: 14px; }
  .st-num { font-size: 44px; }
}

/* ---------- entrance (the map draws first, the chrome follows) ---------- */
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.head { animation: enter 900ms var(--ease) 100ms both; }
.pres { animation: enter 900ms var(--ease) 250ms both; }
.side, .topbar { animation: enter 900ms var(--ease) 900ms both; }
.dock { animation: enter 900ms var(--ease) 1100ms both; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
}

/* ---------- phone ---------- */
@media (max-width: 759px) {
  :root { --low: 0px; }
  .scrim.l { display: none; }
  .scrim.t { display: block; left: 0; right: 0; top: 0; height: 210px; background: linear-gradient(180deg, var(--scrim) 0%, var(--scrim) 55%, var(--scrim-0) 100%); }
  .scrim.b { height: 360px; background: linear-gradient(0deg, var(--scrim) 0%, var(--scrim) 62%, var(--scrim-0) 100%); }
  .hero { top: 14px; left: var(--gut); right: var(--gut); width: auto; }
  .head { flex-direction: row; align-items: baseline; gap: 10px; }
  .brand { font-size: 13px; }
  h1 { font-size: 19px; }
  .pres { display: none; }
  .bignum { margin-top: 6px; display: flex; align-items: baseline; gap: 10px; }
  .big { display: inline; font-size: 46px; letter-spacing: -0.035em; }
  .bigcap { display: inline; margin: 0; font-size: 12.5px; line-height: 1.25; }
  .wk { font-size: 13px; margin-top: 4px; }
  .story { position: fixed; left: var(--gut); right: var(--gut); bottom: var(--story-b, 220px); margin: 0; padding-top: 0; border-top: 0; }
  .st-kick { display: none; }
  .st-row { margin-top: 0; gap: 10px; }
  .st-num { font-size: 34px; }
  .st-lab { font-size: 12.5px; }
  .st-p { font-size: 12.5px; margin-top: 4px; line-height: 1.45; }
  .st-two { gap: 22px; margin-top: 0; }
  .st-two .v { font-size: 30px; }
  .st-two .l { font-size: 12px; margin-top: 3px; }
  .caption { bottom: var(--story-b, 220px); font-size: 14px; text-align: left; left: var(--gut); right: var(--gut); width: auto; transform: translateY(6px); }
  .caption.on { transform: none; }
  .topbar { top: 12px; right: var(--gut); }
  .pill { height: 34px; padding: 0 12px; font-size: 12.5px; }
  .hint { display: none; }
  .side { left: var(--gut); right: var(--gut); bottom: 10px; width: auto; }
  .legend { display: none; }
  .credit { font-size: 9.5px; line-height: 1.4; }
  .dock { left: var(--gut); right: var(--gut); width: auto; bottom: var(--dock-b, 64px); padding: 8px 10px 6px; }
  .dock .row { gap: 8px; }
  .play { width: 34px; height: 34px; }
  .seg button { height: 28px; padding: 0 9px; font-size: 12px; }
  .wkd { font-size: 12.5px; }
  .wkd .wl { display: none; }
  .wkd .ws { display: inline; }
  .step { width: 24px; height: 24px; }
  .legend-m { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-size: 10.5px; color: var(--ink-3); margin: 0 0 2px; }
  .legend-m .bar { height: 5px; border-radius: 3px; }
  .legend-m b { color: var(--ink-2); font-weight: 700; }
  .legend-m .lm2 { grid-column: 1 / -1; margin-top: -3px; }
  .reflab { font-size: 10px; }
  .reflab b { font-size: 11.5px; }
  .tip { font-size: 12.5px; }
  .tipopen .story, .tipopen .caption { opacity: 0 !important; }
  .tip.sheet { left: var(--gut); right: var(--gut); top: auto; bottom: var(--story-b, 220px); width: auto; max-width: none; transform: none; }
}
/* the drag hint would slide under the dock */
@media (min-width: 760px) and (max-width: 1319px) {
  .hint { display: none; }
}
@media (min-width: 760px) and (max-width: 1099px) {
  .hero { width: 330px; }
  .big { font-size: 72px; }
  .scrim.l { width: 520px; }
}
</style>

  $('hint').textContent = webgl ? (COARSE ? 'Arrastra para girar · toca una columna' : 'Arrastra para girar · pasa sobre una columna') : (COARSE ? 'Toca un punto' : 'Pasa sobre un punto');
  renderProductText();
  layout();
  if (REDUCED) {
    // reduced motion: the end state, still; "Repetir" plays the opening on request
    S.fresh = false;
    S.mode = 'opening';
    endOpening(false);
    S.tw = null;
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); });
  requestAnimationFrame(frame);
})();
</script>
