<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A cómo · Respira</title>
<style>
/* Respira. The map is the stage: full-bleed and dark. Words sit top-left, the weeks run along the
   bottom, one number speaks at a time. The breath is the warm accent; blue means "cheaper" and
   nothing else. */
:root {
  color-scheme: dark;
  --bg: #0c1118;
  --ink: #f4f5f7;
  --ink-2: #b9bec7;
  --muted: #8a919c;
  --cheaper: #3987e5;
  --dearer: #e66767;
  --cheaper-ink: #7db3f0;
  --dearer-ink: #f29191;
  --mid: #5b616a;
  --accent: #ece6d8;
  --accent-ink: #14171c;
  --line: rgba(255, 255, 255, 0.08);
  --line-2: rgba(255, 255, 255, 0.18);
  --glass: rgba(14, 19, 28, 0.82);
  --glass-2: rgba(18, 24, 34, 0.96);
  --scrim: rgba(12, 17, 24, 0.94);
  --scrim-0: rgba(12, 17, 24, 0);
  --shadow: rgba(0, 0, 0, 0.45);
  --dot-edge: rgba(8, 12, 18, 0.9);
  --ghost: rgba(185, 190, 199, 0.55);
  --geo-zmvm-fill: rgba(255, 255, 255, 0.012);
  --geo-zmvm-line: rgba(255, 255, 255, 0.055);
  --geo-alc-fill: rgba(255, 255, 255, 0.022);
  --geo-alc-line: rgba(255, 255, 255, 0.1);
  --geo-park: rgba(236, 230, 216, 0.03);
  --geo-water: rgba(185, 190, 199, 0.07);
  --geo-road: rgba(255, 255, 255, 0.055);
  --geo-road-major: rgba(255, 255, 255, 0.095);
  --geo-label: rgba(255, 255, 255, 0.17);
  --font: 'Manrope', system-ui, sans-serif;
  --gut: 48px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --tl-h: clamp(176px, 25vh, 226px);
  --tl-b: calc(40px + var(--sab));
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#app[data-phase="end"] #map { cursor: crosshair; }
.scrim { position: absolute; pointer-events: none; }
.scrim.side { left: 0; top: 0; bottom: 0; width: 640px; background: linear-gradient(90deg, var(--scrim) 0, var(--scrim) 34%, var(--scrim-0) 100%); }
.scrim.foot { left: 0; right: 0; bottom: 0; height: calc(var(--tl-b) + var(--tl-h) + 40px); background: linear-gradient(0deg, var(--scrim) 0, var(--scrim) 62%, var(--scrim-0) 100%); }
.scrim.head { display: none; }

/* words */
.panel { position: absolute; left: var(--gut); top: calc(34px + var(--sat)); width: min(500px, 40vw); display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
.brand { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; color: var(--ink); display: flex; align-items: center; gap: 10px; }
.brand i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.slot { will-change: opacity, transform; }
.eyebrow { margin: clamp(22px, 13vh, 130px) 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); min-height: 17px; }
.display { margin: 0; font-size: clamp(56px, 5.8vw, 96px); font-weight: 800; line-height: 1; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; min-height: 1em; }
.caption { margin: 0; font-size: 17px; line-height: 1.45; color: var(--ink-2); max-width: 30em; text-wrap: pretty; }
#app[data-act="story"] .caption { color: var(--ink); font-size: 19px; line-height: 1.42; max-width: 26em; }
.note { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); max-width: 34em; text-wrap: pretty; }

/* controls */
.topright { position: absolute; top: calc(28px + var(--sat)); right: var(--gut); display: flex; gap: 8px; }
.pill { height: 38px; padding: 0 16px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); color: var(--ink-2); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; transition: color 150ms, border-color 150ms, opacity 300ms; }
.pill:hover { color: var(--ink); border-color: var(--line-2); }
.pill svg { width: 16px; height: 16px; flex: none; }
.pill.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.pill.primary:hover { color: var(--accent-ink); }
[hidden] { display: none !important; }

/* the weeks */
.timeline { position: absolute; left: var(--gut); right: var(--gut); bottom: var(--tl-b); height: var(--tl-h); display: flex; flex-direction: column; gap: 6px; }
.tl-head { display: flex; align-items: center; gap: 12px; height: 30px; flex: none; font-size: 13px; }
.tl-label { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-right { color: var(--muted); font-variant-numeric: tabular-nums; flex: 1 1 auto; min-width: 0; white-space: nowrap; }
.tl-hint { color: var(--muted); font-size: 12px; white-space: nowrap; flex: none; }
.tl-hint kbd { font: inherit; font-weight: 700; color: var(--ink-2); }
.chip { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); font-size: 13px; font-weight: 700; flex: none; transition: background 150ms, color 150ms; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
#strip { flex: 1 1 auto; width: 100%; min-height: 0; display: block; touch-action: pan-y; }
#app[data-phase="end"] #strip { cursor: ew-resize; touch-action: none; }

/* legend */
.legend { position: absolute; left: var(--gut); bottom: calc(var(--tl-b) + var(--tl-h) + 22px); width: 440px; font-size: 12px; color: var(--ink-2); pointer-events: none; }
.legend .bar { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--cheaper), var(--mid), var(--dearer)); background: linear-gradient(in oklab 90deg, var(--cheaper), var(--mid), var(--dearer)); }
.legend .ticks { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; margin-top: 6px; font-variant-numeric: tabular-nums; line-height: 1.3; white-space: nowrap; }
.legend .ticks span:nth-child(2) { text-align: center; }
.legend .ticks span:nth-child(3) { text-align: right; }
.legend .ticks b { color: var(--ink); font-weight: 700; }
.legend .sizes { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 11px; margin-top: 9px; min-height: 20px; color: var(--muted); font-size: 11.5px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.legend .sz { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); white-space: nowrap; }
.legend .sz i { display: inline-block; flex: none; border-radius: 50%; box-shadow: 0 0 0 1px var(--dot-edge); }
.legend .extra { margin-top: 7px; color: var(--muted); font-size: 11.5px; line-height: 1.35; min-height: 1.35em; }
.legend .ring { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--ink-2); margin-right: 6px; vertical-align: 0; }
.legend .ring.acc { border: 1.5px solid var(--accent); width: 10px; height: 10px; vertical-align: -1px; }

/* tags on the map */
#tags { position: absolute; inset: 0; pointer-events: none; }
.tag { position: absolute; left: 0; top: 0; padding: 5px 9px 6px; border-radius: 9px; background: var(--glass-2); border: 1.5px solid var(--cheaper); font-size: 11.5px; line-height: 1.3; color: var(--ink-2); max-width: 270px; box-shadow: 0 8px 24px var(--shadow); }
.tag .tt { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.tag b { color: var(--ink); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tag em { font-style: normal; color: var(--muted); font-size: 11px; }
.tag span { display: block; white-space: normal; text-wrap: balance; }

/* tooltip */
.tip { position: absolute; left: 0; top: 0; z-index: 20; width: max-content; max-width: min(300px, calc(100vw - 32px)); padding: 10px 12px 11px; border-radius: 12px; background: var(--glass-2); border: 1px solid var(--line-2); font-size: 13px; line-height: 1.35; color: var(--ink-2); pointer-events: none; box-shadow: 0 12px 34px var(--shadow); }
.tip .n { color: var(--ink); font-weight: 700; }
.tip .s { color: var(--muted); font-size: 12px; margin-top: 1px; }
.tip .p { margin-top: 6px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tip .p b { color: var(--ink); font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tip .d { font-size: 12px; margin-top: 2px; }

.credit { position: absolute; left: var(--gut); right: var(--gut); bottom: calc(14px + var(--sab)); margin: 0; font-size: 11px; line-height: 1.35; color: var(--muted); pointer-events: none; }

#app.tight[data-act="story"] .note { display: none; }

@media (max-width: 759px) {
  :root { --gut: 16px; --tl-h: clamp(140px, 20vh, 172px); --tl-b: calc(54px + var(--sab)); }
  .scrim.side { display: none; }
  .scrim.head { display: block; left: 0; right: 0; top: 0; height: 260px; background: linear-gradient(180deg, var(--scrim) 0, var(--scrim) 52%, var(--scrim-0) 100%); }
  .scrim.foot { height: calc(var(--tl-b) + var(--tl-h) + 128px); background: linear-gradient(0deg, var(--scrim) 0, var(--scrim) 66%, var(--scrim-0) 100%); }
  .panel { left: 16px; right: 16px; top: calc(14px + var(--sat)); width: auto; gap: 7px; }
  .eyebrow { margin-top: 12px; font-size: 11px; letter-spacing: 0.12em; }
  .display { font-size: 52px; }
  .caption { font-size: 14.5px; line-height: 1.42; }
  #app[data-act="story"] .caption { font-size: 15px; }
  .note { font-size: 12px; line-height: 1.45; }
  #app[data-act="story"] .note { display: none; }
  .topright { top: calc(10px + var(--sat)); right: 16px; }
  .pill { height: 32px; padding: 0 12px; font-size: 13px; }
  .timeline { gap: 2px; }
  /* two short rows (the week, then its count) beside the chip, at a fixed height so the strip never squeezes */
  .tl-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; align-content: center; column-gap: 8px; row-gap: 1px; font-size: 12px; height: 36px; }
  .tl-label { grid-column: 1; grid-row: 1; line-height: 1.25; }
  .tl-right { grid-column: 1; grid-row: 2; line-height: 1.25; }
  .chip { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  .tl-hint { display: none; }
  .chip { height: 28px; padding: 0 10px; font-size: 12px; }
  .legend { left: 16px; right: 16px; width: auto; bottom: calc(var(--tl-b) + var(--tl-h) + 8px); font-size: 11px; }
  .legend .ticks { gap: 6px; }
  .legend .sizes { font-size: 11px; gap: 3px 9px; margin-top: 7px; }
  .legend .extra { font-size: 11px; margin-top: 5px; min-height: 2.7em; }
  .tag { max-width: 172px; font-size: 10.5px; padding: 3px 8px 4px; border-radius: 8px; }
  .tag b { font-size: 13px; }
  .credit { font-size: 10px; bottom: calc(8px + var(--sab)); }
}
@media (max-width: 759px) and (max-height: 700px) {
  .display { font-size: 44px; }
  .note { display: none; }
  .legend .extra { display: none; }
}
</style>

<div id="app" data-phase="opening" data-act="breath">
  <canvas id="map" aria-label="Mapa de tiendas de la Ciudad de México y su zona metropolitana"></canvas>
  <div class="scrim side"></div>
  <div class="scrim head"></div>
  <div class="scrim foot"></div>
  <div id="tags" aria-hidden="true"></div>

  <header class="panel">
    <div class="brand"><i></i>A cómo</div>
    <p class="eyebrow slot" id="eyebrow"></p>
    <p class="display slot" id="display"></p>
    <p class="caption slot" id="caption"></p>
    <p class="note slot" id="note"></p>
  </header>

  <div class="topright">
    <button class="pill" id="skip" type="button">Saltar</button>
    <button class="pill primary" id="replay" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Repetir</button>
  </div>

  <div class="legend slot" id="legend">
    <div class="bar"></div>
    <div class="ticks">
      <span><b>−50&nbsp;%</b> o más barato</span>
      <span><b id="lgRef"></b> mediana reciente</span>
      <span><b>+50&nbsp;%</b> o más caro</span>
    </div>
    <div class="sizes" id="lgSizes"></div>

  <section class="timeline" id="timeline" aria-label="Semanas">
    <div class="tl-head">
      <span class="tl-label slot" id="tlLabel"></span>
      <span class="tl-right slot" id="tlRight"></span>
      <span class="tl-hint" id="tlHint" hidden>Arrastra sobre la curva o usa <kbd>←</kbd> <kbd>→</kbd> para cambiar de semana</span>
      <button class="chip" id="recent" type="button" aria-pressed="true" hidden>Reciente</button>
    </div>
    <canvas id="strip" role="slider" aria-label="Semana del jitomate" aria-describedby="stripHelp" aria-disabled="true" tabindex="-1"></canvas>
    <p class="sr" id="stripHelp">Flechas: semana anterior o siguiente. Inicio: la primera semana. Fin: los precios recientes.</p>
  </section>

  <div class="tip" id="tip" hidden></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const app = $('app');
  const D = window.DEMO;
  if (!D || !window.d3) {
    $('caption').textContent = 'No se pudieron cargar los datos o la biblioteca del mapa. Recarga la página.';
    app.dataset.phase = 'error';
    return;
  }

  // ---------- small helpers ----------
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const c01 = (x) => clamp(x, 0, 1);
  const lerp = (a, b, p) => a + (b - a) * p;
  const ease = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const easeOut = (p) => 1 - Math.pow(1 - c01(p), 3);
  const rootCss = getComputedStyle(document.documentElement);
  const tok = (n) => rootCss.getPropertyValue(n).trim();
  const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const ymd = (s) => s.split('-').map(Number);
  const fDay = (s, year = true) => { const [y, m, d] = ymd(s); return `${d} ${MES[m - 1]}${year ? ' ' + y : ''}`; };
  const fRange = (a, b) => {
    const [y1, m1, d1] = ymd(a), [y2, m2, d2] = ymd(b);
    if (y1 === y2 && m1 === m2) return `${d1}–${d2} ${MES[m2 - 1]} ${y2}`;
    if (y1 === y2) return `${d1} ${MES[m1 - 1]} – ${d2} ${MES[m2 - 1]} ${y2}`;
    return `${fDay(a)} – ${fDay(b)}`;
  };
  const nf = new Intl.NumberFormat('es-MX');
  const r2 = (x) => Math.round(Number((x * 100).toPrecision(12))) / 100; // half-up on the decimal value
  const money = (x) => '$' + r2(x).toFixed(2);
  const NB = ' ';
  const median = (a) => {
    const v = a.filter((x) => x != null && Number.isFinite(x)).sort((x, y) => x - y);
    if (!v.length) return null;
    const m = v.length >> 1;
    return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
  };
  const KIND = { super: 'súper', mercado: 'mercado', central: 'central de abasto', tortilleria: 'tortillería', tradicional: 'tradicional', farmacia: 'farmacia', conveniencia: 'conveniencia' };
  // display names: PROFECO's "Sucursal" and trailing branch number are database detail, not part of
  // the name; the number stays only where two stores would otherwise read the same
  const rawClean = (s) => String(s || '').replace(/\s*\(\d+\)\s*$/, '').replace(/\bSucursal\s+/g, '').replace(/\s{2,}/g, ' ').trim();
  const cleanCount = new Map();
  D.stores.forEach((s) => { const c = rawClean(s[0]); cleanCount.set(c, (cleanCount.get(c) || 0) + 1); });
  const storeName = (i) => {
    const raw = String(D.stores[i][0] || ''), c = rawClean(raw);
    if (!c) return raw;
    if (cleanCount.get(c) > 1) { const m = raw.match(/\((\d+)\)\s*$/); if (m) return `${c} (${m[1]})`; }
    return c;
  };

  // ---------- everything on screen comes from DEMO ----------
  const V = D.visits, NW = V.weeks.length, NS = D.stores.length;
  const partial = new Set(D.partialWeeks);
  const bits = new Uint8Array(NS * NW);
  V.rows.forEach((r, i) => { for (let j = 0; j < NW; j++) bits[i * NW + j] = r.charCodeAt(j) === 49 ? 1 : 0; });
  const cum = []; { let a = 0; V.products.forEach((p, j) => { a += p; cum[j] = a; }); }
  const maxCount = Math.max(...V.count);
  const visitedAny = V.rows.filter((r) => r.includes('1')).length;

  const J = D.jitomate, JW = J.weeks, NK = JW.length, ref = J.ref;
  const jIdx = Object.keys(J.prices).map(Number);
  const isJ = new Uint8Array(NS); jIdx.forEach((i) => { isJ[i] = 1; });
  const wMed = JW.map((w, k) => median(jIdx.map((i) => J.prices[i][k])));
  const wN = JW.map((w, k) => jIdx.filter((i) => J.prices[i][k] != null).length);
  const off = Math.max(0, V.weeks.indexOf(JW[0])); // the jitomate's 26 weeks are the survey's last 26
  const ST = D.stories.jitomate;
  const peakK = JW.indexOf(ST.peakWeek), lastK = JW.indexOf(ST.lastWeek);
  const matched = new Uint8Array(NS);
  jIdx.forEach((i) => { const a = J.prices[i]; if (a[peakK] != null && a[lastK] != null) matched[i] = 1; });
  const cheap = Object.entries(J.latest).map(([i, [p, d]]) => ({ i: +i, p, d })).sort((a, b) => a.p - b.p || a.i - b.i);
  const top3 = cheap.slice(0, 3);
  const tieMore = top3.length === 3 ? cheap.slice(3).filter((c) => c.p === top3[2].p).length : 0;
  const recentLabel = fRange(D.recent.from, D.recent.to);
  const norm = (p) => clamp((p - ref) / ref / 0.5, -1, 1); // ±50 % cap, as the legend says

  // story text, all computed
  const pct = Math.round((ST.medianRatio - 1) * 100);
  const share = Math.round(ST.medianRatio * 100);
  const sameYear = ST.peakWeek.slice(0, 4) === ST.lastWeek.slice(0, 4);
  const bigStory = (pct < 0 ? '−' : '+') + Math.abs(pct) + NB + '%';
  const storyEyebrow = `${J.name} · ${fDay(ST.peakWeek, !sameYear)} → ${fDay(ST.lastWeek)}`;
  const storyLine = `En las mismas ${ST.matched} tiendas, el ${J.name.toLowerCase()} de la semana del ${fDay(ST.lastWeek, !sameYear)} costó, en la mediana, el ${share}${NB}% de lo que costaba en la del ${fDay(ST.peakWeek, !sameYear)}.`;
  const storyNote = `La del ${fDay(ST.peakWeek, false)} fue la semana de mediana más alta de las ${JW.length}. El ${bigStory} es la mediana del cambio de cada una de esas ${ST.matched} tiendas (su precio del ${fDay(ST.lastWeek, false)} entre el del ${fDay(ST.peakWeek, false)}). La curva, en cambio, es la mediana de todas las tiendas con precio cada semana.`;
  const cap1 = V.totalWhat.charAt(0).toUpperCase() + V.totalWhat.slice(1) + '.';
  const note1Short = `Cada punto es una de las ${visitedAny} tiendas y se enciende la semana en que PROFECO anotó precios ahí.`;
  const note1 = `${note1Short} Del ${fDay(V.weeks[0])} al ${fDay(D.latestDate)}.`;
  // "1 Kg. Granel. Saladette/huaje o Tomate Saladette/huaje" → "Jitomate saladette o huaje, el kilo a granel."
  const presTxt = (() => {
    const parts = String(J.presentation || '').split('.').map((s) => s.trim()).filter(Boolean);
    let qty = '', loose = false, kind = '';
    for (const p of parts) {
      const m = p.match(/^(\d+(?:,\d+)?)\s*(kg|g|l|ml)$/i);
      if (m && !qty) { const n = m[1], u = m[2].toLowerCase(); qty = n === '1' && u === 'kg' ? 'el kilo' : n === '1' && u === 'l' ? 'el litro' : `${n} ${u}`; continue; }
      if (/^granel$/i.test(p)) { loose = true; continue; }
      if (!kind) kind = p.split(/\s+o\s+/i)[0].replace(/\s*\/\s*/g, ' o ').toLowerCase();
    }
    if (!qty && !kind) return J.presentation ? `${J.presentation}.` : '';

      c.font = FONT_S; c.textAlign = 'right'; c.fillStyle = C.ink2; c.globalAlpha = F.curveA * 0.95;
      const tl = wrapLines(c, curveTitle, phone ? SW * 0.46 : SW * 0.5);
      tl.forEach((s, n) => haloText(c, s, SW - 1, 10 + n * 12.5));
      c.textAlign = 'left';
    }
    c.globalAlpha = 1;
  }

  // ---------- words and chrome ----------
  const els = { eyebrow: $('eyebrow'), display: $('display'), caption: $('caption'), note: $('note'), tlLabel: $('tlLabel'), tlRight: $('tlRight') };
  const shown = {};
  function applyTexts(F) {
    for (const k of Object.keys(els)) {
      const s = F.texts[k], el = els[k];
      if (shown[k] !== s.text) { el.textContent = s.text; shown[k] = s.text; }
      const a = Math.round(s.a * 1000) / 1000;
      if (el._a !== a) { el.style.opacity = a; el.style.transform = a < 1 ? `translateY(${((1 - a) * 6).toFixed(2)}px)` : ''; el._a = a; }
    }
    if (app.dataset.act !== F.act) { app.dataset.act = F.act; tagsPlaced = false; }
    const lg = $('legend');
    if (lg._a !== F.legendA) { lg.style.opacity = F.legendA; lg._a = F.legendA; }
    if (lg._m !== F.legendMode) {
      lg._m = F.legendMode;
      const m = $('lgMode'); m.textContent = '';
      if (F.legendMode === 'story') {
        const i = document.createElement('i'); i.className = 'ring acc';
        m.append(i, `Anilladas: las ${ST.matched} tiendas con precio el ${fDay(ST.peakWeek, false)} y el ${fDay(ST.lastWeek, false)}`);
      } else if (F.legendMode === 'recent') m.textContent = tagsLine;
    }
  }
  $('lgRef').textContent = money(ref);
  const tieP = top3.length ? money(top3[top3.length - 1].p) : '';
  const tagsLine = top3.length
    ? `Con etiqueta: las ${top3.length} más baratas.` + (tieMore === 1 ? ` Otra tienda también cobra ${tieP}.` : tieMore > 1 ? ` Otras ${tieMore} tiendas también cobran ${tieP}.` : '')
    : '';
  $('credit').textContent = D.credit;
  $('summary').textContent = `${nf.format(V.total)} ${V.totalWhat}. ${storyEyebrow}: ${bigStory}. ${storyLine}`;

  // ---------- tags on the three cheapest stores ----------
  const tagRoot = $('tags');
  const tagEls = top3.map((o) => {
    const el = document.createElement('div'); el.className = 'tag';
    const top = document.createElement('div'); top.className = 'tt';
    const b = document.createElement('b'); b.textContent = money(o.p);
    const d = document.createElement('em'); d.textContent = fDay(o.d, false);
    top.append(b, d);
    const n = document.createElement('span'); n.textContent = storeName(o.i);
    el.append(top, n); el.style.borderColor = colorOf(norm(o.p)); el.style.opacity = 0;
    tagRoot.appendChild(el);
    return { el, i: o.i, ax: 0, ay: 0, lx: 0, ly: 0 };
  });
  let tagsPlaced = false;
  function placeTags() {
    const avoid = ['.panel', '#legend', '#timeline', '.topright', '#credit'].map((s) => document.querySelector(s).getBoundingClientRect())
      .filter((b) => b.width > 0).map((b) => [b.left - 6, b.top - 6, b.right + 6, b.bottom + 6]);
    // the panel's real text block only (it is wide but short)
    const placed = [];
    const hit = (a, b) => !(a[2] < b[0] || a[0] > b[2] || a[3] < b[1] || a[1] > b[3]);
    const pts = tagEls.map((t) => [PX[t.i] - 10, PY[t.i] - 10, PX[t.i] + 10, PY[t.i] + 10]);
    let cx = 0, cy = 0; for (const i of jIdx) { cx += PX[i]; cy += PY[i]; } cx /= jIdx.length; cy /= jIdx.length;
    for (const tg of tagEls) {
      const w = tg.el.offsetWidth, h = tg.el.offsetHeight, x = PX[tg.i], y = PY[tg.i], g = phone ? 16 : 26;
      const cands = [[x + g, y - h - g * 0.5], [x - g - w, y - h - g * 0.5], [x + g, y + g * 0.5], [x - g - w, y + g * 0.5], [x + g + 10, y - h / 2], [x - g - 10 - w, y - h / 2], [x - w / 2, y - h - g * 1.3], [x - w / 2, y + g * 1.3]];
      let best = null, bestScore = Infinity;
      cands.forEach(([bx, by]) => {
        const box = [bx, by, bx + w, by + h];
        let score = 0;
        if (box[0] < 12 || box[1] < 12 || box[2] > W - 12 || box[3] > H - 12) score += 100;
        for (const a of avoid) if (hit(box, a)) score += 30;
        for (const p of placed) if (hit(box, [p[0] - 8, p[1] - 8, p[2] + 8, p[3] + 8])) score += 60;
        for (const p of pts) if (hit(box, p)) score += 25;
        // cover as few stores as possible, and lean away from the middle of the city
        for (const i of jIdx) if (PX[i] > box[0] - 3 && PX[i] < box[2] + 3 && PY[i] > box[1] - 3 && PY[i] < box[3] + 3) score += 1.5;
        const bcx = (box[0] + box[2]) / 2, bcy = (box[1] + box[3]) / 2;
        score -= 0.02 * (Math.hypot(bcx - cx, bcy - cy) - Math.hypot(x - cx, y - cy));
        if (score < bestScore) { bestScore = score; best = box; }
      });
      best[0] = clamp(best[0], 12, W - 12 - w); best[1] = clamp(best[1], 12, H - 12 - h);
      best[2] = best[0] + w; best[3] = best[1] + h;
      placed.push(best);
      tg.el.style.transform = `translate(${Math.round(best[0])}px, ${Math.round(best[1])}px)`;
      // leader: from the dot's edge to the nearest point of the box
      const lx = clamp(x, best[0], best[2]), ly = clamp(y, best[1], best[3]);
      const dx = lx - x, dy = ly - y, L = Math.hypot(dx, dy) || 1, rr = rad(R.q[tg.i]) + 2.6;
      tg.ax = x + (dx / L) * rr; tg.ay = y + (dy / L) * rr; tg.lx = lx; tg.ly = ly;
    }
    tagsPlaced = true;
    drawLabels(placed.map((b) => [b[0] - 6, b[1] - 6, b[2] + 6, b[3] + 6])); // the alcaldía names keep clear of the tags
  }
  function applyTags(F) {
    if (F.tagsA > 0 && !tagsPlaced) placeTags();
    for (const tg of tagEls) {
      const a = tagsPlaced ? Math.round(F.tagsA * 1000) / 1000 : 0;
      if (tg._a !== a) { tg.el.style.opacity = a; tg._a = a; }
    }
  }

  function render(F) {
    applyTexts(F);
    applyTags(F);
    drawMap(F);
    drawStrip(F);
  }

  // ---------- controls ----------
  const skipB = $('skip'), replayB = $('replay'), recentB = $('recent'), tip = $('tip');
  let playing = false, endMode = false, t0 = 0, dirty = true;
  const reduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const freezeAt = (() => { try { const q = new URLSearchParams(location.search).get('t'); return q != null && q !== '' && Number.isFinite(+q) ? +q : null; } catch (e) { return null; } })();

  // the strip is a slider over 27 stops: the 26 weeks, then the recent window
  stripC.setAttribute('aria-valuemin', '1'); stripC.setAttribute('aria-valuemax', String(NK + 1));
  function sliderAria() {
    const wk = E.mode === 'week';
    stripC.setAttribute('aria-valuenow', String(wk ? E.k + 1 : NK + 1));
    stripC.setAttribute('aria-valuetext', wk ? `Semana del ${fDay(JW[E.k])}: ${wN[E.k]} tiendas con precio, mediana ${money(wMed[E.k])}` : `Precios del ${recentLabel}: ${J.n} tiendas, mediana ${money(ref)}`);
  }
  function play() {
    hideTip(); E.hover = -1;
    playing = true; endMode = false; t0 = performance.now();
    app.dataset.phase = 'opening';
    skipB.hidden = false; replayB.hidden = true; recentB.hidden = true; $('tlHint').hidden = true;
    stripC.tabIndex = -1; stripC.setAttribute('aria-disabled', 'true');
  }
  function finish() {
    playing = false; endMode = true;
    E.mode = 'recent'; E.k = lastK; copyState(E.from, R); E.to = R; E.t0 = -1e9;
    app.dataset.phase = 'end';
    skipB.hidden = true; replayB.hidden = false; recentB.hidden = false; $('tlHint').hidden = false;
    recentB.setAttribute('aria-pressed', 'true');
    stripC.tabIndex = 0; stripC.removeAttribute('aria-disabled'); sliderAria();
    dirty = true;
  }
  function setEnd(mode, k) {
    if (!endMode) return;
    if (mode === E.mode && (mode === 'recent' || k === E.k)) return;
    const now = performance.now();
    const p = ease(c01((now - E.t0) / E.dur));
    const snap = mkState(); lerpState(snap, E.from, E.to, p);
    E.from = snap; E.to = mode === 'recent' ? R : S[k];
    E.mode = mode; if (mode === 'week') E.k = k;
    E.t0 = now; E.dur = reduce.matches ? 1 : 380;
    recentB.setAttribute('aria-pressed', String(mode === 'recent'));
    sliderAria();
    if (E.pinned && E.hover >= 0) showTip(E.hover);
    dirty = true;
  }
  skipB.addEventListener('click', () => { if (playing) finish(); });
  replayB.addEventListener('click', () => play());
  recentB.addEventListener('click', () => setEnd('recent'));
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && playing) finish(); });

  // scrub the 26 weeks
  const kFromX = (x) => clamp(Math.round(x / stripGeom(1).slot - 0.5), 0, NK - 1); // zoomed: week k sits at (k + 0.5) slots
  let scrubbing = false;
  stripC.addEventListener('pointerdown', (e) => {
    if (!endMode) return;
    scrubbing = true; stripC.setPointerCapture(e.pointerId);
    const r = stripC.getBoundingClientRect(); setEnd('week', kFromX(e.clientX - r.left));
  });
  stripC.addEventListener('pointermove', (e) => {
    if (!scrubbing) return;
    const r = stripC.getBoundingClientRect(); setEnd('week', kFromX(e.clientX - r.left));
  });
  const endScrub = () => { scrubbing = false; };
  stripC.addEventListener('pointerup', endScrub); stripC.addEventListener('pointercancel', endScrub);
  stripC.addEventListener('keydown', (e) => {
    if (!endMode) return;
    const k = E.mode === 'week' ? E.k : NK;
    let n = null;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') n = Math.max(0, k - 1);
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') n = k + 1;
    else if (e.key === 'Home') n = 0;
    else if (e.key === 'End') n = NK;
    if (n == null) return;
    e.preventDefault();
    if (n >= NK) setEnd('recent'); else setEnd('week', n);
  });

  // hover or tap a store
  function nearest(x, y, maxD) {
    let best = -1, bd = maxD * maxD;
    for (const i of jIdx) { const dx = PX[i] - x, dy = PY[i] - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
    return best;
  }
  function showTip(i) {
    const s = D.stores[i];
    let price = null, when = '';
    if (E.mode === 'recent') { const l = J.latest[i]; if (l) { price = l[0]; when = fDay(l[1]); } }
    else { const p = J.prices[i][E.k]; if (p != null) price = p; when = `semana del ${fDay(JW[E.k])}`; }
    tip.textContent = '';
    const n = document.createElement('div'); n.className = 'n'; n.textContent = storeName(i);
    const sub = document.createElement('div'); sub.className = 's'; const kind = KIND[s[2]] || s[2];
    sub.textContent = s[1] && s[1].toLowerCase().includes(kind) ? s[1] : [s[1], kind].filter(Boolean).join(' · ');
    const p = document.createElement('div'); p.className = 'p';
    if (price != null) {
      const b = document.createElement('b'); b.textContent = money(price);
      const w = document.createElement('span'); w.textContent = when;
      p.append(b, w);
      const d = document.createElement('div'); d.className = 'd';
      const dev = (price - ref) / ref, q = Math.round(Math.abs(dev) * 100);
      d.textContent = q === 0 ? `igual a la mediana reciente (${money(ref)})` : `${q}${NB}% ${dev < 0 ? 'abajo' : 'arriba'} de la mediana reciente (${money(ref)})`;
      d.style.color = q === 0 ? C.ink2 : dev < 0 ? C.cheaperInk : C.dearerInk;
      tip.append(n, sub, p, d);
    } else {
      p.textContent = E.mode === 'recent' ? `Sin precio en ${recentLabel}` : `Sin precio la semana del ${fDay(JW[E.k])}`;
      tip.append(n, sub, p);
    }
    tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight, x = PX[i], y = PY[i];
    let lx = x + 16, ly = y - th - 12;
    if (lx + tw > W - 12) lx = x - 16 - tw;
    if (lx < 12) lx = clamp(x - tw / 2, 12, W - 12 - tw);
    const pBot = document.querySelector('.panel').getBoundingClientRect().bottom;
    if (ly < 12 || (phone && ly < pBot)) ly = y + 18;
    if (ly + th > H - 12) ly = Math.max(12, y - th - 12);
    tip.style.transform = `translate(${Math.round(lx)}px, ${Math.round(ly)}px)`;
  }
  function hideTip() { tip.hidden = true; E.pinned = false; }
  mapC.addEventListener('pointermove', (e) => {
    if (!endMode || e.pointerType !== 'mouse') return;
    const i = nearest(e.clientX, e.clientY, 14);
    if (i !== E.hover) { E.hover = i; if (i >= 0) showTip(i); else hideTip(); dirty = true; }
  });
  mapC.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && E.hover >= 0) { E.hover = -1; hideTip(); dirty = true; } });
  mapC.addEventListener('click', (e) => {
    if (!endMode) return;
    const i = nearest(e.clientX, e.clientY, 22);
    if (i >= 0) { E.hover = i; E.pinned = true; showTip(i); } else { E.hover = -1; hideTip(); }
    dirty = true;
  });

  // ---------- run ----------
  function frame(now) {
    if (playing) {
      const t = now - t0;
      if (t >= T.done) finish(); else render(compose(t));
    }
    if (endMode && (dirty || now - E.t0 < E.dur + 40)) { dirty = false; render(composeEnd(now)); }
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', () => { resize(); hideTip(); E.hover = -1; });
  resize();
  if (freezeAt != null) {
    if (freezeAt >= T.done) finish();
    else { app.dataset.phase = 'frozen'; skipB.hidden = true; render(compose(freezeAt)); }
  } else if (reduce.matches) finish();
  else play();
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { resize(); });
  window.__respira = { T, phase: () => app.dataset.phase, xy: (i) => [PX[i], PY[i]], get started() { return t0; }, labels: () => labelsShown.slice(), proj: () => proj }; // for tests
})();
</script>
